<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Manager animated hero preview</title>
  <style>
    body {
      margin: 0;
      background: #f6f8fa;
      color: #1f2328;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(900px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    img { display: block; width: 100%; height: auto; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { color: #59636e; font-size: 14px; margin-bottom: 18px; }
    @media (max-width: 520px) {
      main { width: 100%; margin: 0; padding: 18px; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="note">Animated GIF preview. README is intentionally unchanged. Editable source: <code>hero-motion.svg</code>.</p>
    <img src="./hero-motion.gif" alt="Animated Skill Manager hero showing a notch workspace with skills, notes, and files.">
  </main>
</body>
</html>
