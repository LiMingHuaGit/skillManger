<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Manager usage GIF preview</title>
  <style>
    body {
      margin: 0;
      background: #f6f8fa;
      color: #1f2328;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1040px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { color: #59636e; font-size: 14px; margin: 0 0 16px; }
    @media (max-width: 560px) {
      main { width: 100%; margin: 0; padding: 16px; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="note">README usage GIF preview. Generated by <code>../../script/render_usage_gif.py</code>.</p>
    <img src="./software-usage.gif" alt="Skill Manager usage demo showing quick skill search, the focused library, and quick note capture.">
  </main>
</body>
</html>
